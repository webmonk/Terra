[package]
name = "terra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terrain processing domain: heightfields, layers, masks, evaluation"

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
profiling = { workspace = true }

[dev-dependencies]
approx = "0.5"
# `default-features = false` drops the HTML/plotters report stack: benches print
# their numbers to stdout, which is all the perf work needs and keeps the
# dev-dependency tree (and bench compile time) small.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "eval_rebuild"
harness = false

[[bench]]
name = "fingerprint"
harness = false

[[bench]]
name = "mask_and_composite"
harness = false
