# GPU parity matrix against Mesa lavapipe (software Vulkan).
#
# The `gpu_required_*` tests in crates/terra-gpu/tests/parity_matrix.rs
# panic without an adapter and are skipped by the main CI workflow. Here
# they run for real: mesa-vulkan-drivers provides lavapipe, a software
# Vulkan implementation wgpu picks up when no hardware adapter exists,
# so the CPU-vs-GPU tolerance contracts are enforced on every push.
#
# This leg also runs terra-render's tests. Those self-skip when there is no
# adapter, which means the main CI workflow reports them green without ever
# executing them; lavapipe is where they actually run.

name: GPU parity

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Prefer Vulkan so wgpu binds lavapipe rather than failing over to GL.
  WGPU_BACKEND: vulkan

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install lavapipe and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-vulkan-drivers libvulkan-dev vulkan-tools \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Report Vulkan adapter
        run: vulkaninfo --summary || true

      - name: Run parity matrix
        run: cargo test -p terra-gpu --test parity_matrix --locked --no-fail-fast

      # terra-render's render tests self-skip without an adapter, so on the main
      # CI legs they pass by never running. This is the only leg where they
      # actually execute - the double-buffer seeding and terrain AO regressions
      # they guard are invisible to a run that skips.
      - name: Run terra-render GPU tests
        run: cargo test -p terra-render --locked --no-fail-fast
